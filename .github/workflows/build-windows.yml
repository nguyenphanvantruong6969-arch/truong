# Đóng gói bản Windows của phần mềm phân bổ câu lạc bộ.
#
# VÌ SAO CẦN WORKFLOW NÀY. PyInstaller đóng gói cho ĐÚNG hệ điều hành đang
# chạy lệnh — không build chéo từ Linux/macOS ra `.exe` được (xem đầu tệp
# `rbda-kiosk/kiosk.spec`). Máy ảo `windows-latest` của GitHub là một máy
# Windows thật, nên nó build ra đúng thứ nhà trường cần, và nó cũng đi qua
# nhánh Windows của `kiosk.spec` — nhánh gom `pythonnet`/`clr` cho
# pywebview, đúng chỗ đã hỏng ở một lần build trước.
#
# Kết quả: mục **Artifacts** của mỗi lần chạy có một tệp nén chứa TRỌN thư
# mục `PhanBoCauLacBo`. Phải tải và giải nén CẢ thư mục — chỉ lấy riêng
# `.exe` thì thiếu `_internal/` và app không chạy.

name: Đóng gói bản Windows

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      # Chỉ build khi phần mềm đổi. Sửa tài liệu (.md, .html) không sinh
      # ra bản đóng gói khác, build lại chỉ tốn thời gian chờ.
      - "rbda-kiosk/**"
      - "!rbda-kiosk/**.md"
      - "!rbda-kiosk/**.html"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
    inputs:
      bo_qua_test:
        description: "Bỏ qua bộ test (chỉ dùng khi cần bản build gấp)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # requirements.txt ghi "Python 3.10+". Chọn 3.12 vì pywebview 5 và
  # pythonnet 3 đều hỗ trợ, và đó là bản có sẵn trên máy ảo nên không
  # phải tải thêm.
  PYTHON_VERSION: "3.12"
  THU_MUC: rbda-kiosk

jobs:
  # ---------------------------------------------------------------------
  # 1. Bộ test — chạy trên Windows, không phải Linux
  #
  # Bộ test vẫn chạy xanh trên Linux ở máy phát triển. Chạy lại trên
  # Windows là để bắt đúng loại lỗi mà Linux không thấy: đường dẫn dùng
  # dấu gạch chéo ngược, tệp mở không đóng nên không xoá được, bảng mã
  # mặc định của console. Đó là những lỗi chỉ hiện ra ở đúng nơi nhà
  # trường chạy phần mềm.
  # ---------------------------------------------------------------------
  test:
    name: Bộ test trên Windows
    runs-on: windows-latest
    if: ${{ !inputs.bo_qua_test }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: rbda-kiosk/requirements*.txt

      - name: Cài phụ thuộc
        working-directory: ${{ env.THU_MUC }}
        # CỐ Ý không cài playwright. Nhóm test giao diện gọi
        # `pytest.importorskip("playwright")`: thiếu gói thì chúng TỰ BỎ
        # QUA, còn cài gói mà không tải trình duyệt kèm theo thì chúng
        # CHẾT khi mở trình duyệt — tệ hơn hẳn việc bỏ qua.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Chạy bộ test
        working-directory: ${{ env.THU_MUC }}
        run: python -m pytest tests/ -q

  # ---------------------------------------------------------------------
  # 2. Đóng gói
  # ---------------------------------------------------------------------
  build:
    name: Đóng gói .exe
    runs-on: windows-latest
    needs: test
    # `always()` để job này vẫn xét khi job test bị BỎ QUA (lúc chọn
    # bỏ qua test). Điều kiện thật nằm ở vế sau: test xanh, hoặc người
    # chạy chủ động chọn bỏ qua.
    if: ${{ always() && (needs.test.result == 'success' || inputs.bo_qua_test) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: rbda-kiosk/requirements*.txt

      - name: Cài phụ thuộc
        working-directory: ${{ env.THU_MUC }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ghi lại phiên bản các gói đã dùng
        working-directory: ${{ env.THU_MUC }}
        # Bản build hỏng vì một gói phụ thuộc lên phiên bản mới là chuyện
        # đã xảy ra với pythonnet. Có danh sách này thì lần sau dựng lại
        # được đúng môi trường đã cho ra bản chạy được.
        run: pip freeze > phien_ban_goi.txt

      - name: Chạy PyInstaller
        working-directory: ${{ env.THU_MUC }}
        run: pyinstaller kiosk.spec --noconfirm

      # -----------------------------------------------------------------
      # Soát bản đóng gói TRƯỚC khi đưa cho người dùng.
      #
      # Đây là bước quan trọng nhất của workflow. Lỗi đáng sợ nhất không
      # phải build thất bại — build thất bại thì biết ngay. Lỗi đáng sợ là
      # build THÀNH CÔNG mà bên trong là giao diện của bản CŨ: phần mềm
      # chạy được, trông bình thường, chỉ thiếu đúng tính năng vừa làm.
      # So từng tệp bằng mã băm thì chuyện đó không lọt qua.
      # -----------------------------------------------------------------
      - name: Soát bản đóng gói khớp mã nguồn
        working-directory: ${{ env.THU_MUC }}
        shell: pwsh
        run: |
          $goc = "dist\PhanBoCauLacBo"
          $noi_bo = "$goc\_internal"
          $loi = 0

          if (-not (Test-Path "$goc\PhanBoCauLacBo.exe")) {
            Write-Output "::error::Khong thay PhanBoCauLacBo.exe"
            exit 1
          }

          foreach ($f in @("index.html", "style.css", "app.js", "i18n.js",
                           "recovery.html", "recovery.js", "logo.png", "logo.ico")) {
            $goi = Join-Path $noi_bo $f
            if (-not (Test-Path $goi)) {
              Write-Output "::error::Thieu trong ban dong goi: $f"
              $loi++
              continue
            }
            $a = (Get-FileHash $f    -Algorithm SHA256).Hash
            $b = (Get-FileHash $goi  -Algorithm SHA256).Hash
            if ($a -ne $b) {
              Write-Output "::error::Ban dong goi lech khoi ma nguon: $f"
              $loi++
            } else {
              Write-Output "khop: $f"
            }
          }

          $fonts = Get-ChildItem "$noi_bo\assets\fonts" -Filter *.woff2 -ErrorAction SilentlyContinue
          if ($fonts.Count -lt 1) {
            Write-Output "::error::Thieu bo chu trong assets/fonts"
            $loi++
          } else {
            Write-Output "bo chu: $($fonts.Count) tep"
          }

          if ($loi -gt 0) { exit 1 }
          Write-Output "Ban dong goi khop ma nguon."

      - name: Kèm hướng dẫn vào thư mục giao đi
        working-directory: ${{ env.THU_MUC }}
        shell: pwsh
        # Người nhận tệp nén này thường không phải người đọc kho mã. Kèm
        # sẵn hướng dẫn cài đặt và phiên bản đã build để họ không phải đi
        # tìm, và để sau này truy được bản nào ra từ commit nào.
        run: |
          Copy-Item HUONG_DAN_CAI_DAT.md "dist\PhanBoCauLacBo\" -ErrorAction SilentlyContinue
          Copy-Item HUONG_DAN_SU_DUNG.md "dist\PhanBoCauLacBo\" -ErrorAction SilentlyContinue
          Copy-Item phien_ban_goi.txt    "dist\PhanBoCauLacBo\" -ErrorAction SilentlyContinue
          @"
          Ban dong goi tu kho ma nguon
          ----------------------------
          Nhanh   : ${{ github.ref_name }}
          Commit  : ${{ github.sha }}
          Build   : $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC
          Python  : ${{ env.PYTHON_VERSION }}

          Chay PhanBoCauLacBo.exe. Phai giu NGUYEN ca thu muc nay —
          thu muc _internal di kem la bat buoc.
          "@ | Out-File -Encoding utf8 "dist\PhanBoCauLacBo\PHIEN_BAN.txt"

      - name: Tải bản đóng gói lên
        uses: actions/upload-artifact@v4
        with:
          name: PhanBoCauLacBo-${{ github.run_number }}-${{ github.sha }}
          path: ${{ env.THU_MUC }}/dist/PhanBoCauLacBo/
          if-no-files-found: error
          retention-days: 90

      # Build hỏng thì nhật ký của PyInstaller là thứ duy nhất truy được
      # nguyên nhân, mà nó nằm trong thư mục build đã bị .gitignore chặn.
      - name: Giữ lại nhật ký khi build hỏng
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nhat-ky-build-hong-${{ github.run_number }}
          path: |
            ${{ env.THU_MUC }}/build/
            ${{ env.THU_MUC }}/phien_ban_goi.txt
          if-no-files-found: ignore
          retention-days: 14
